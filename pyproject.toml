[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "modelsign"
dynamic = ["version"]
description = "Sign AI models with identity. Verify anywhere. Part of the AURE Provenance stack by Constant Systems."
authors = [{name = "James Kerr", email = "qj@constantqj.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=41.0",
    "click>=8.0",
    "rfc8785>=0.1.2",
]

[project.optional-dependencies]
middleware = ["fastapi>=0.100"]
dev = ["pytest>=7.0", "pytest-cov", "mypy"]

[project.scripts]
modelsign = "modelsign.cli:main"

[project.urls]
Homepage = "https://constantsystems.ai/provenance"
Repository = "https://github.com/QuantQJ/modelsign"
Issues = "https://github.com/QuantQJ/modelsign/issues"
Documentation = "https://constantsystems.ai/provenance"

[tool.setuptools.dynamic]
version = {attr = "modelsign.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# mypy itself no longer targets 3.9; the 3.9 CI leg is what proves 3.9 works.
python_version = "3.10"
files = ["src/modelsign"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional at runtime and unstubbed; the guard imports them defensively.
module = ["huggingface_hub.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
