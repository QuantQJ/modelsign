name: 'Verify signed models'
description: 'Fail the build unless model files verify against a key you trust.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  model:
    description: 'Path to the model file or directory to verify.'
    required: true
  pubkey:
    description: 'Trusted Ed25519 public key PEM, for a modelsign .sig.'
    required: false
    default: ''
  oms-pubkey:
    description: 'Trusted ECDSA public key PEM, for an OpenSSF Model Signing bundle.'
    required: false
    default: ''
  bundle:
    description: 'Path to the OMS bundle (default: model.sig beside the model).'
    required: false
    default: ''
  version:
    description: 'modelsign version to install (default: latest).'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install modelsign
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?$'; then
          echo "::error::version must be a plain release number, got '$VERSION'"
          exit 1
        fi
        if command -v modelsign >/dev/null 2>&1 && [ -z "$VERSION" ]; then
          echo "using the modelsign already on PATH: $(modelsign version)"
        elif [ -n "$VERSION" ]; then
          pip install --disable-pip-version-check "modelsign==$VERSION"
        else
          pip install --disable-pip-version-check modelsign
        fi

    - name: Verify
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        PUBKEY: ${{ inputs.pubkey }}
        OMS_PUBKEY: ${{ inputs.oms-pubkey }}
        BUNDLE: ${{ inputs.bundle }}
      run: |
        set -euo pipefail

        if [ -z "$PUBKEY" ] && [ -z "$OMS_PUBKEY" ]; then
          echo "::error::provide pubkey (modelsign .sig) or oms-pubkey (OMS bundle)"
          exit 1
        fi

        if [ -n "$OMS_PUBKEY" ]; then
          args=(oms verify "$MODEL" --pubkey "$OMS_PUBKEY")
          if [ -n "$BUNDLE" ]; then
            args+=(--bundle "$BUNDLE")
          fi
        else
          args=(verify "$MODEL" --pubkey "$PUBKEY")
        fi

        echo "::group::modelsign ${args[*]}"
        if modelsign "${args[@]}"; then
          echo "::endgroup::"
        else
          status=$?
          echo "::endgroup::"
          echo "::error title=Unverified model::model did not verify"
          exit $status
        fi
