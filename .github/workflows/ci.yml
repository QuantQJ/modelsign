name: CI

on:
  push:
    branches: [main]
    # Without this a tag push does not match `branches`, so the workflow never
    # ran for a tag and the publish job below was unreachable.
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9, so that leg pins
    # an older runner rather than dropping the version pyproject still claims.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            runner: ubuntu-24.04
          - python-version: "3.11"
            runner: ubuntu-latest
          - python-version: "3.12"
            runner: ubuntu-latest
          - python-version: "3.13"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Type check
        run: mypy

  action:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this checkout
        run: pip install -e .

      - name: Build signed fixtures
        run: |
          # Separate models per format: a modelsign directory signature covers
          # every file in the directory, including a bundle written into it.
          for d in fixture-modelsign fixture-oms; do
            mkdir -p "$d"
            echo "weights" > "$d/model.safetensors"
            echo '{"model_type":"llama"}' > "$d/config.json"
          done
          modelsign keygen --out keys/private.pem
          modelsign sign fixture-modelsign --name "CI-Fixture" --key keys/private.pem
          modelsign oms keygen --dir keys
          modelsign oms export fixture-oms --key keys/oms_private.pem \
            --out fixture-oms/model.sig

      - name: Action verifies a modelsign signature
        uses: ./
        with:
          model: fixture-modelsign
          pubkey: keys/public.pem

      - name: Action verifies an OMS bundle
        uses: ./
        with:
          model: fixture-oms
          oms-pubkey: keys/oms_public.pem

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
